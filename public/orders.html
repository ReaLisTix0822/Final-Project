<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไปยังคำสั่งซื้อของฉัน | ตลาดใจ</title>
    <script>
        const destination = new URL('/profile.html', window.location.origin);
        destination.searchParams.set('tab', 'tracking');
        const orderId = new URLSearchParams(window.location.search).get('id');
        if (orderId) destination.searchParams.set('id', orderId);
        window.location.replace(destination.href);
    </script>
</head>
<body>
    <p><a href="/profile.html?tab=tracking">ไปยังคำสั่งซื้อของฉัน</a></p>
</body>
</html>
